# Produção (VPS): HTTPS com domínio e backup diário do banco.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    # Sem porta aberta direto: o acesso passa só pelo Caddy, com HTTPS.
    ports: !reset []
    environment:
      DJANGO_SECURE_COOKIES: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Informe DOMAIN no arquivo .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-motel}
      PGPASSWORD: ${POSTGRES_PASSWORD:-motel}
      PGDATABASE: ${POSTGRES_DB:-motel}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-04}
      TZ: America/Sao_Paulo
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
